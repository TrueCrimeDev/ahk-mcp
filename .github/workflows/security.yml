name: Security

on:
  schedule:
    - cron: "0 2 * * *" # daily, to pick up newly published advisories
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # npm audit reads package-lock.json; no install needed.
      - name: Runtime dependencies (high and above fail)
        run: npm audit --omit=dev --audit-level=high

      - name: All dependencies (report only)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  license-check:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Allowed licenses only
        run: >-
          npx --yes license-checker@25.0.1 --summary --onlyAllow
          'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Python-2.0;CC-BY-4.0;CC0-1.0;BlueOak-1.0.0'

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: moderate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Without base/head the action scans the commits of this push or PR.
      - uses: trufflesecurity/trufflehog@v3.97.9
        with:
          extra_args: --only-verified
