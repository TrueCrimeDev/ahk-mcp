name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # Code quality: ESLint, TypeScript, formatting
  lint:
    name: Lint, types & formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (maintained scope)
        run: npm run lint

      - name: TypeScript type checking
        run: npm run check:types

      - name: Check code formatting
        run: npx prettier --check "src/**/*.ts" "Tests/**/*.ts"

  # Known vulnerabilities in what ships (dev-only dependencies are covered by security.yml)
  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=moderate

  # Build and test on the supported Node LTS lines (package.json engines: >=20)
  build-and-test:
    name: Build & test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run unit and contract tests
        run: npm test

      # Needs dist/ from the build step (spawns the built server)
      - name: Run integration tests
        run: npm run test:integration

      - name: Run portable runtime tests
        run: npm run test:portable

      # Headless MCP protocol checks against the built server (stdio and HTTP)
      - name: Smoke test MCP over stdio
        run: npm run smoke:mcp

      - name: Smoke test MCP 2026-07-28 protocol
        run: npm run smoke:mcp:2026

      - name: Smoke test MCP over HTTP
        run: npm run smoke:http

  # Verify the production image still builds (not pushed)
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: false
          tags: ahk-mcp-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
