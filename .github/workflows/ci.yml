name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run check:types
      # ts-jest transpiles without type-checking, so the suites get their own pass.
      - name: Type-check tests
        run: node node_modules/typescript/bin/tsc -p Tests/setup/tsconfig.tests.json
      - run: npm run lint
      - run: npm run build

      # gen-tools-docs may read the registry from dist, so this runs after the
      # build. One OS is enough: the output does not depend on the platform.
      # The tools generator arrives later (WP40); until then only the config
      # docs are checked, and the full docs:check takes over by itself.
      - name: Check generated docs are fresh
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f scripts/gen-tools-docs.mjs ]; then
            npm run docs:check
          elif [ -f scripts/gen-config-docs.mjs ]; then
            node scripts/gen-config-docs.mjs --check
          else
            echo "No documentation generators yet."
          fi

      - run: npm test
      - run: npm run smoke:mcp
      - run: npm run smoke:mcp:2026

  autohotkey:
    name: AutoHotkey v2 tests (windows-latest)
    runs-on: windows-latest
    env:
      AHK_VERSION: "2.0.28"
      # SHA-256 of AutoHotkey_<AHK_VERSION>.zip; update both together.
      AHK_ZIP_SHA256: b63be7548792b4ad0dfe424d91cc69376694ed2f758245b7a75a0c77d693b478
      # A missing runtime fails the job instead of skipping every suite.
      AHK_TEST_REQUIRE_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install AutoHotkey v2
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "AutoHotkey_$env:AHK_VERSION.zip"
          $dir = Join-Path $env:RUNNER_TEMP 'AutoHotkey'
          Invoke-WebRequest -Uri "https://www.autohotkey.com/download/2.0/AutoHotkey_$env:AHK_VERSION.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:AHK_ZIP_SHA256) { throw "AutoHotkey archive hash mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Join-Path $dir 'AutoHotkey64.exe'
          if (-not (Test-Path $exe)) { throw 'AutoHotkey64.exe is missing from the archive' }
          "AHK_MCP_AHK_PATH=$exe" >> $env:GITHUB_ENV
          $dir >> $env:GITHUB_PATH

      - name: Check the AutoHotkey runtime
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'version.ahk'
          Set-Content -Path $script -Value 'FileAppend A_AhkVersion "`n", "*"'
          $version = & $env:AHK_MCP_AHK_PATH /ErrorStdOut $script | Out-String
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne $env:AHK_VERSION) {
            throw "AutoHotkey did not run (exit $LASTEXITCODE, output '$version')"
          }
          Write-Output "AutoHotkey $($version.Trim())"

      - run: npm ci
      - run: npm run build
      - run: npm run test:ahk

  privacy:
    name: Privacy denylist scan
    runs-on: ubuntu-latest
    # The denylist is a repository secret, which forks and pull requests from
    # forks do not receive. Everywhere else a missing secret fails the scan.
    if: ${{ !github.event.repository.fork && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Scan tracked files
        run: node scripts/check-privacy.mjs
        env:
          AHK_MCP_PRIVACY_DENYLIST: ${{ secrets.AHK_MCP_PRIVACY_DENYLIST }}
