name: Release

# Publishing happens only for a pushed version tag (for example v3.0.0 or
# v3.0.0-rc.1) that matches package.json. Nothing else publishes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No dependency cache here: a poisoned cache must not reach a publish.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Privacy denylist scan
        run: node scripts/check-privacy.mjs
        env:
          AHK_MCP_PRIVACY_DENYLIST: ${{ secrets.AHK_MCP_PRIVACY_DENYLIST }}

      - run: npm ci
      - run: npm run check:types
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run smoke:mcp
      - run: npm run smoke:mcp:2026

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.version.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
